name: Check No Man's Sky News

on:
  schedule:
    - cron: "*/14 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nms-discord-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Usar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Comprobar último post
        run: node check-nms.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MIN_CHECK_INTERVAL_MINUTES: "14"

      - name: Guardar estado
        run: |
          if [ ! -f state.json ]; then
            echo "No se ha generado state.json. No hay nada que guardar."
            exit 0
          fi

          git config user.name "nms-discord-alerts"
          git config user.email "nms-discord-alerts@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "No hay cambios de estado."
          else
            git commit -m "Update latest seen NMS post"
            git push
          fi
